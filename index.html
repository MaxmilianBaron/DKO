<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Interaktivní mobilní náhled DSO — Digitální Správa Objektů." />
    <title>DSO · mobile UI preview</title>
    <link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      if (window.matchMedia('(max-width: 520px)').matches) {
        window.location.replace('./app/?v=100');
      }
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="preview-shell">
      <header class="preview-header">
        <div class="preview-brand">
          <img src="./assets/app-icon.svg" alt="" />
          <div>
            <span>DSO V1.0</span>
            <strong>Digitální Správa Objektů · mobile preview</strong>
          </div>
        </div>
        <a href="./app/?v=100" target="_blank" rel="noreferrer">Otevřít samostatně</a>
      </header>
      <div class="phone" aria-label="Interaktivní mobilní náhled DSO">
        <iframe src="./app/?v=100" title="DSO — Digitální Správa Objektů"></iframe>
      </div>
      <p class="preview-note">Bezpečný statický UI mirror · falešná data · bez backendu</p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
